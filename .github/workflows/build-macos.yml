name: Build macOS (Apple Silicon & Intel)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS ${{ matrix.arch }} (${{ matrix.arch == 'arm64' && 'Apple Silicon' || 'Intel' }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64
          - x64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Application Dependencies
        run: npm ci

      - name: Install Remotion Environment Dependencies
        run: npm --prefix remotion_env ci || npm --prefix remotion_env install

      - name: Prepare Portable Node Binary for ${{ matrix.arch }}
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: node scripts/setup-node-bin.js --arch=${{ matrix.arch }}

      - name: Verify Architecture and Execution Permissions
        run: |
          echo "=== Node binary details ==="
          ls -la resources/bin/
          file resources/bin/node || true

      - name: Compile and Bundle Frontend & Main
        run: npm run build

      - name: Package macOS App (.dmg and .zip) - Unsigned Bypass
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: npx electron-builder --mac --${{ matrix.arch }} -c.mac.identity=null

      - name: Verify Built Packages
        run: |
          echo "=== Generated Distribution Files ==="
          ls -lh dist/

      - name: Upload Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Motion-Suite-Pro-macOS-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 30

      - name: Attach Assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
