name: Build macOS v1.0.7 (Intel & Apple Silicon)

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    env:
      TARGET_ARCH: ${{ matrix.arch }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies on the matching native runner
        run: |
          npm ci
          npm --prefix remotion_env ci
      - name: Prepare and verify portable Node
        run: |
          node scripts/setup-node-bin.js --arch=${{ matrix.arch }}
          file resources/bin/node
          test "$(resources/bin/node -p 'process.arch')" = "$TARGET_ARCH"
          test "$(node -p 'process.arch')" = "$TARGET_ARCH"
          test "$(node -p 'require("./node_modules/electron/package.json").version')" = '44.2.0'
      - name: Typecheck and compile into isolated staging
        run: |
          npm run typecheck
          node node_modules/typescript/bin/tsc --noEmit -p remotion_env/tsconfig.json
          node node_modules/electron-vite/bin/electron-vite.js build --outDir "$RUNNER_TEMP/msp-release/bundles"
      - name: Prepare clean resources and package without publication
        run: |
          node scripts/prepare-release.cjs --bundles "$RUNNER_TEMP/msp-release/bundles" --output "$RUNNER_TEMP/msp-release/package" --platform mac --arch "$TARGET_ARCH"
          node node_modules/electron-builder/out/cli/cli.js --config "$RUNNER_TEMP/msp-release/package/release-config.json" --mac dmg --${{ matrix.arch }} --publish never
      - name: Verify packaged architecture and minimum macOS version
        run: |
          APP=$(find "$RUNNER_TEMP/msp-release/package/artifacts" -maxdepth 2 -name 'Motion Suite Pro.app' -type d -print -quit)
          test -n "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP/Contents/Info.plist")" = '13.0'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = '1.0.7'
          EXPECTED=$TARGET_ARCH
          if [ "$EXPECTED" = x64 ]; then EXPECTED=x86_64; fi
          lipo "$APP/Contents/MacOS/Motion Suite Pro" -verify_arch "$EXPECTED"
          lipo "$APP/Contents/Resources/bin/node" -verify_arch "$EXPECTED"
          test "$("$APP/Contents/Resources/bin/node" -p 'process.arch')" = "$TARGET_ARCH"
          test ! -e "$APP/Contents/Resources/bin/node.exe"
          test -f "$APP/Contents/Resources/typescript/lib/lib.esnext.full.d.ts"
          test -f "$APP/Contents/Resources/remotion_env/src/primitives/ThreeScene.tsx"
          test -f "$APP/Contents/Resources/remotion_env/src/primitives/SvgStrokeReveal.tsx"
          while IFS= read -r -d '' BINARY; do
            case "$(file -b "$BINARY")" in
              *Mach-O*) lipo "$BINARY" -verify_arch "$EXPECTED" ;;
            esac
          done < <(find "$APP/Contents" -type f -print0)
          "$APP/Contents/Resources/bin/node" - "$APP/Contents/Resources" <<'NODE'
          const fs = require('fs'), path = require('path'), assert = require('assert');
          const resources = process.argv[2], runtime = path.join(resources, 'remotion_env');
          for (const [name, version] of Object.entries({remotion: '4.0.520', '@remotion/cli': '4.0.520', '@remotion/three': '4.0.520', three: '0.178.0', '@react-three/fiber': '9.2.0'})) {
            const pkg = JSON.parse(fs.readFileSync(path.join(runtime, 'node_modules', name, 'package.json')));
            assert.strictEqual(pkg.version, version, 'Packaged dependency version: ' + name);
            require.resolve(name, {paths: [runtime]});
          }
          const types = path.join(resources, 'typescript', 'lib');
          assert(fs.existsSync(path.join(types, 'lib.esnext.full.d.ts')));
          NODE
          DMG="$RUNNER_TEMP/msp-release/package/artifacts/Motion Suite Pro-1.0.7-mac-$TARGET_ARCH.dmg"
          test -f "$DMG"
          test "$(find "$RUNNER_TEMP/msp-release/package/artifacts" -maxdepth 1 -name '*.dmg' -type f | wc -l | tr -d ' ')" = '1'
          test -z "$(find "$RUNNER_TEMP/msp-release/package/artifacts" -maxdepth 1 -name '*.zip' -type f -print)"
          shasum -a 256 "$DMG"
          codesign -dv --verbose=2 "$APP" 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: Motion-Suite-Pro-v1.0.7-macOS-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/msp-release/package/artifacts/*.dmg
          if-no-files-found: error
          retention-days: 30
