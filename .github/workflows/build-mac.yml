name: Build macOS Installer (v1.0.6)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS Multi-Architecture (ARM64 & x64)
    runs-on: macos-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Install Dependencies
        run: |
          npm ci || npm install
          npm --prefix remotion_env ci || npm --prefix remotion_env install

      - name: 4. Build Application
        run: npm run build

      - name: 5. Packaging Mac Multi-Architecture (.dmg and .zip)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac dmg zip --arm64 --x64 -c.mac.identity=null

      - name: 6. Upload Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Motion-Suite-Pro-macOS-v1.0.6
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 30

      - name: Attach Assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
