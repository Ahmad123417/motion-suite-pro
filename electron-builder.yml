appId: com.motionsuitepro.app
productName: Motion Suite Pro

directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - resources/icon.png

extraResources:
  - from: remotion_env
    to: remotion_env
    filter:
      - '**/*'
      - '!node_modules/**/*'
      - '!renders/*'
      - '!out/*'
      - '!public/assets/overlay-logo.*'
  - from: remotion_env/node_modules
    to: remotion_env/node_modules
    filter:
      - '**/*'
      - '!.cache/**/*'
      - '!.remotion/**/*'
  - from: resources/bin
    to: bin
    filter:
      - 'node*'
  - from: resources
    to: .
    filter:
      - 'icon.png'
      - 'icon.ico'
      - 'icon.icns'
  - from: README_DAN_SPESIFIKASI.txt
    to: README_DAN_SPESIFIKASI.txt

extraFiles:
  - from: README_DAN_SPESIFIKASI.txt
    to: README_DAN_SPESIFIKASI.txt

win:
  executableName: Motion Suite Pro
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "${productName}.Setup.${version}.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Motion Suite Pro
  uninstallDisplayName: Motion Suite Pro
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico

mac:
  executableName: Motion Suite Pro
  category: public.app-category.video
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  artifactName: "${productName}-${version}-mac-${arch}.${ext}"
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  minimumSystemVersion: "11.0"

dmg:
  sign: false
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

publish:
  provider: "github"
  owner: "Ahmad123417"
  repo: "motion-suite-pro"
  releaseType: "release"

npmRebuild: false
