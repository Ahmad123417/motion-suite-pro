appId: com.motionsuitepro.app
productName: Motion Suite Pro

directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - resources/icon.png

extraResources:
  - from: node_modules/typescript
    to: typescript
    filter:
      - 'lib/*.d.ts'
      - 'package.json'
      - 'LICENSE.txt'
      - 'ThirdPartyNoticeText.txt'
  - from: remotion_env
    to: remotion_env
    filter:
      - '**/*'
      - '!node_modules/**/*'
      - '!renders/*'
      - '!out/*'
      - '!public/assets/overlay-logo.*'
  - from: remotion_env/node_modules
    to: remotion_env/node_modules
    filter:
      - '**/*'
      - '!.cache/**/*'
      - '!.remotion/**/*'
  - from: resources
    to: .
    filter:
      - 'icon.png'
      - 'icon.ico'
      - 'icon.icns'
  - from: README_DAN_SPESIFIKASI.txt
    to: README_DAN_SPESIFIKASI.txt
  - from: PETUNJUK_AKTIVASI.txt
    to: PETUNJUK_AKTIVASI.txt
  - from: user-guide.html
    to: user-guide.html
  - from: README.md
    to: README.md
  - from: 00_BACA_DULU_FAQ_DAN_KETENTUAN.txt
    to: 00_BACA_DULU_FAQ_DAN_KETENTUAN.txt

extraFiles:
  - from: README.md
    to: README.md
  - from: 00_BACA_DULU_FAQ_DAN_KETENTUAN.txt
    to: 00_BACA_DULU_FAQ_DAN_KETENTUAN.txt
  - from: README_DAN_SPESIFIKASI.txt
    to: README_DAN_SPESIFIKASI.txt
  - from: PETUNJUK_AKTIVASI.txt
    to: PETUNJUK_AKTIVASI.txt
  - from: user-guide.html
    to: user-guide.html

win:
  extraResources:
    - from: resources/bin/node.exe
      to: bin/node.exe
  executableName: Motion Suite Pro
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "Motion-Suite-Pro.Setup.${version}.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Motion Suite Pro
  uninstallDisplayName: Motion Suite Pro
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico

mac:
  extraResources:
    - from: resources/bin/node
      to: bin/node
  executableName: Motion Suite Pro
  category: public.app-category.video
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  artifactName: "${productName}-${version}-mac-${arch}.${ext}"
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  minimumSystemVersion: "13.0"

dmg:
  sign: false
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

publish:
  provider: "github"
  owner: "Ahmad123417"
  repo: "motion-suite-pro"
  releaseType: "release"

npmRebuild: false
